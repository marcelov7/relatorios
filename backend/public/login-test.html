<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Teste de Login</h1>
    <form id="loginForm" method="post" action="javascript:void(0);">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="admin@example.com" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" value="123456" required>
        </div>
        <button type="submit" id="submitBtn">Entrar</button>
    </form>
    <div id="result"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página de teste de login carregada');
            
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                console.log('Formulário enviado');
                
                const email = document.getElementById('email').value;
                const senha = document.getElementById('senha').value;
                const resultDiv = document.getElementById('result');
                
                console.log('Enviando requisição com:', { email, senha });
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = '<h3>Enviando requisição...</h3>';
                
                try {
                    const response = await fetch('/api/mock/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, senha })
                    });
                    
                    console.log('Resposta recebida:', response.status);
                    const data = await response.json();
                    console.log('Dados recebidos:', data);
                    
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `
                        <h3>Resposta:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    
                    if (data.success) {
                        resultDiv.style.backgroundColor = '#dff0d8';
                        resultDiv.style.borderColor = '#d6e9c6';
                        // Armazenar o token no localStorage (simulando autenticação)
                        localStorage.setItem('token', data.data.token);
                        console.log('Login bem-sucedido, token armazenado');
                    } else {
                        resultDiv.style.backgroundColor = '#f2dede';
                        resultDiv.style.borderColor = '#ebccd1';
                        console.log('Login falhou:', data.error);
                    }
                    
                } catch (error) {
                    console.error('Erro na requisição:', error);
                    resultDiv.style.display = 'block';
                    resultDiv.style.backgroundColor = '#f2dede';
                    resultDiv.style.borderColor = '#ebccd1';
                    resultDiv.innerHTML = `
                        <h3>Erro:</h3>
                        <p>${error.message}</p>
                    `;
                }
            });
    </script>
</body>
</html>
